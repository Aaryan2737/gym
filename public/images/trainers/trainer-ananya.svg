<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="50%" stop-color="#111111" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#D8FF35" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#111111" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#glow)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <g opacity="0.1" stroke="#D8FF35" stroke-width="2" fill="none">
    <circle cx="510" cy="225" r="120" />
    <circle cx="510" cy="225" r="200" stroke-dasharray="8 8" />
    <line x1="0" y1="600" x2="600" y2="600" stroke="rgba(255,255,255,0.08)" />
  </g>

  <g transform="translate(48, 660)">
    <rect x="-12" y="-36" width="6" height="44" fill="#D8FF35" />
    <text x="6" y="-12" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="0.05em">
      ANANYA DESAI
